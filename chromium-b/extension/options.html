<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TubeExt 设置</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><img src="icons/icon.png" alt="TubeExt"><b>TubeExt 设置</b></header>
<section class="panel"><h2>启动行为</h2><p class="muted">默认每次新建标签显示 TubeExt 首页。首次安装会打开 YouTube；勾选后，每次启动 Chromium 也可自动打开 YouTube。</p>
<label><input id="open-startup" type="checkbox" style="width:auto;min-height:0"> 浏览器启动时新建 YouTube 标签页</label><button class="primary" id="save" style="width:100%">保存</button>
<p class="tip">这不是官方 YouTube APP。插件可以按 Chromium 原本的方式使用，但扩展兼容性取决于浏览器与扩展版本。</p></section>
</main><script src="options.js"></script></body></html>
