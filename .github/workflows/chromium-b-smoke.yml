name: "Chromium B — Android launch smoke test"
on:
  push:
    branches: [chromium-b]
    paths:
      - ".github/workflows/chromium-b-smoke.yml"
      - "chromium-b/scripts/smoke.sh"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44495097192
          name: TubeExt-Chromium-B-experimental-arm64
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable Android Emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Android emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash chromium-b/scripts/smoke.sh
      - name: Always upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tubeext-chromium-b-smoke-output
          path: test-output/
          if-no-files-found: ignore
