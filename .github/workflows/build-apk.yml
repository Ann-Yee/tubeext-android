name: Cloud Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already ships an Android SDK; avoid the obsolete
      # android-actions/setup-android "sdkmanager tools" installation.
      - name: Install SDK platform and licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TubeExt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
