name: "Chromium B — compare upstream and repackage Android startup"
on:
  push:
    branches: [chromium-b]
    paths:
      - '.github/workflows/chromium-b-diff-smoke.yml'
      - 'chromium-b/scripts/diff-smoke.sh'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44496401327
          name: TubeExt-Chromium-B-experimental-arm64
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify official Bare APK for control test
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o dist/Bare-2.0.7-arm64-v8a.apk https://github.com/BareBrowser/bare-browser/releases/download/v2.0.7/Bare-2.0.7-arm64-v8a.apk
          curl -fLsS --retry 3 -o dist/SHA256SUMS.txt https://github.com/BareBrowser/bare-browser/releases/download/v2.0.7/SHA256SUMS.txt
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch upstream and TubeExt in same Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash chromium-b/scripts/diff-smoke.sh
      - name: Upload test report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TubeExt-Chromium-B-upstream-vs-modified-log
          path: test-output
          if-no-files-found: ignore
